<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Quiz Cookie Instagrameable</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--pink:#F9D2DF;--pink-dark:#E8A6BE;--pink-light:#FDF0F5;--accent:#D4547A;--bg:#FFFFFF;--text:#1A1A2E;--text-light:#555;--green:#16A34A;--red:#DC2626;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.08)}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}
.app{max-width:480px;margin:0 auto;padding:0 16px 32px;position:relative}
/* Progress */
.progress-wrap{position:sticky;top:0;z-index:100;background:var(--bg);padding:12px 0 8px}
.progress-bar{height:6px;background:#eee;border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--pink-dark));border-radius:3px;transition:width .4s ease}
.progress-text{font-size:11px;color:var(--text-light);text-align:center;margin-top:4px}
/* Step container */
.step{display:none;animation:fadeIn .35s ease}
.step.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
/* Typography */
h2{font-size:20px;font-weight:800;line-height:1.3;margin-bottom:16px;text-align:center}
.alert-box{background:var(--pink-light);border-left:4px solid var(--accent);padding:14px 16px;border-radius:0 var(--radius) var(--radius) 0;margin:12px 0;font-size:14px;font-weight:600;line-height:1.5}
.alert-box.green{background:#ECFDF5;border-left-color:var(--green)}
.text-block{font-size:15px;line-height:1.6;margin:12px 0;text-align:center}
.text-block strong,.text-block b{font-weight:700}
/* Options grid */
.options-grid{display:grid;gap:10px;margin:16px 0}
.options-grid.cols-2{grid-template-columns:1fr 1fr}
.opt-btn{background:var(--bg);border:2px solid #E5E5E5;border-radius:var(--radius);padding:12px;text-align:center;cursor:pointer;transition:all .2s;font-size:14px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:8px}
.opt-btn:active,.opt-btn.selected{border-color:var(--accent);background:var(--pink-light);transform:scale(.97)}
.opt-btn img{width:64px;height:64px;object-fit:contain;border-radius:8px;pointer-events:none}
.opt-btn span{pointer-events:none}
/* Multi-select */
.multi-select .opt-btn.selected{border-color:var(--accent);background:var(--pink-light)}
.multi-select .opt-btn.selected::after{content:'✓';position:absolute;top:6px;right:8px;color:var(--accent);font-weight:800;font-size:16px}
.multi-select .opt-btn{position:relative}
/* Buttons */
.btn{display:block;width:100%;padding:16px;border:none;border-radius:var(--radius);font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;transition:all .2s;margin:12px 0}
.btn-primary{background:var(--accent);color:#fff;box-shadow:0 4px 16px rgba(212,84,122,.3)}
.btn-primary:active{transform:scale(.97);background:#C04570}
.btn-secondary{background:#f0f0f0;color:var(--text)}
/* Images */
.step-img{width:100%;border-radius:var(--radius);margin:12px 0;display:block}
/* Loading */
.loading-wrap{text-align:center;padding:40px 0}
.loading-spinner{width:64px;height:64px;border:4px solid #eee;border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 20px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-pct{font-size:32px;font-weight:800;color:var(--accent)}
.loading-label{font-size:14px;color:var(--text-light);margin-top:8px}
/* Lead form */
.form-group{margin:12px 0}
.form-group label{display:block;font-size:13px;font-weight:600;margin-bottom:4px;color:var(--text-light)}
.form-group input{width:100%;padding:14px 16px;border:2px solid #E5E5E5;border-radius:var(--radius);font-family:inherit;font-size:15px;transition:border-color .2s}
.form-group input:focus{outline:none;border-color:var(--accent)}
/* Pitch page */
.pitch-section{margin:20px 0}
.price-card{background:var(--pink-light);border:2px solid var(--accent);border-radius:var(--radius);padding:20px;text-align:center;margin:16px 0}
.price-card .old-price{font-size:18px;color:var(--text-light);text-decoration:line-through}
.price-card .new-price{font-size:36px;font-weight:900;color:var(--accent)}
.price-card .installments{font-size:14px;color:var(--text-light);margin-top:4px}
.line-item{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee;font-size:14px}
.line-item .name{font-weight:600}
.line-item .val{color:var(--text-light);text-decoration:line-through}
.guarantee-box{background:#FFF7ED;border:2px solid #F59E0B;border-radius:var(--radius);padding:20px;text-align:center;margin:20px 0}
.guarantee-box img{width:80px;margin-bottom:12px}
/* FAQ */
.faq-item{border:1px solid #eee;border-radius:var(--radius);margin:8px 0;overflow:hidden}
.faq-q{padding:14px 16px;font-weight:700;font-size:14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;background:var(--pink-light)}
.faq-q::after{content:'+';font-size:20px;font-weight:800;color:var(--accent);transition:transform .2s}
.faq-item.open .faq-q::after{transform:rotate(45deg)}
.faq-a{padding:0 16px;max-height:0;overflow:hidden;transition:all .3s;font-size:13px;line-height:1.6;color:var(--text-light)}
.faq-item.open .faq-a{padding:12px 16px;max-height:500px}
/* Comparison */
.compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.compare-col{border-radius:var(--radius);padding:16px;font-size:13px}
.compare-col.trad{background:#FEE2E2;border:2px solid var(--red)}
.compare-col.insta{background:#ECFDF5;border:2px solid var(--green)}
.compare-col h4{font-size:14px;margin-bottom:8px}
.compare-col li{margin:6px 0;line-height:1.4}
/* Carousel placeholder */
.carousel-wrap{display:flex;gap:12px;overflow-x:auto;padding:12px 0;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.carousel-wrap::-webkit-scrollbar{display:none}
.carousel-card{min-width:260px;scroll-snap-align:start;background:var(--pink-light);border-radius:var(--radius);padding:16px;font-size:13px;line-height:1.5}
/* Checklist */
.checklist{margin:12px 0}
.check-item{display:flex;gap:8px;padding:8px 0;font-size:14px;line-height:1.5}
.check-item .icon{flex-shrink:0;font-size:16px}
/* Metric */
.metric-row{display:flex;justify-content:space-between;padding:8px 12px;margin:4px 0;background:var(--pink-light);border-radius:8px;font-size:13px;font-weight:600}
/* Scroll indicator */
.scroll-hint{text-align:center;font-size:24px;animation:bounce 1.5s infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}
/* Video embed */
.video-placeholder{background:#000;border-radius:var(--radius);padding:40px;text-align:center;color:#fff;font-size:14px;margin:12px 0}
</style>
</head>

function renderStep(idx){
  const s=steps[idx];
  const el=document.getElementById('stepsContainer');
  el.innerHTML='';
  const div=document.createElement('div');
  div.className='step active';

  // Update progress
  const pct=Math.round(((idx+1)/TOTAL_STEPS)*100);
  document.getElementById('progressFill').style.width=pct+'%';
  document.getElementById('progressText').textContent=`Paso ${idx+1} de ${TOTAL_STEPS}`;

  if(s.type==='loading'){
    div.innerHTML=renderLoading(s);
    el.appendChild(div);
    animateLoading(idx);
    return;
  }
  if(s.type==='pitch'){
    div.innerHTML=renderPitch();
    el.appendChild(div);
    initFaq();
    window.scrollTo({top:0,behavior:'smooth'});
    return;
  }

  let html='';
  if(s.title)html+=`<h2>${s.title}</h2>`;

  const layers=s.layers||[];
  let hasMulti=false;
  let multiId='';
  layers.forEach((l,li)=>{
    if(l.type==='alert')html+=`<div class="alert-box">${l.text}</div>`;
    else if(l.type==='text')html+=`<div class="text-block">${l.text}</div>`;
    else if(l.type==='options'){
      const m=l.multi?true:false;
      if(m){hasMulti=true;multiId='multi_'+li;}
      const cols=l.cols===2?' cols-2':'';
      html+=`<div class="options-grid${cols}${m?' multi-select':''}" data-multi="${m}" id="${m?multiId:''}">`;
      l.options.forEach((o,oi)=>{
        html+=`<div class="opt-btn" data-idx="${oi}" data-value="${o.value||o.text}" onclick="${m?'toggleMulti(this)':'selectOption(this,'+idx+')'}">`;
        if(o.image)html+=`<img src="${o.image}" alt="${o.text}" loading="lazy">`;
        html+=`<span>${o.text}</span></div>`;
      });
      html+='</div>';
    }else if(l.type==='button'){
      const cls=l.cls||'btn-primary';
      if(s.type==='lead'&&l.label){
        html+=`<button class="btn ${cls}" onclick="submitLead(${idx})">${l.label}</button>`;
      }else{
        html+=`<button class="btn ${cls}" onclick="goNext(${idx})">${l.label}</button>`;
      }
    }else if(l.type==='fields'){
      l.fields.forEach(f=>{
        html+=`<div class="form-group"><label>${f.label}</label><input type="${f.type}" name="${f.name}" id="field_${f.name}" placeholder="${f.placeholder||''}"></div>`;
      });
    }else if(l.type==='metric'&&l.items){
      l.items.forEach(m=>{
        html+=`<div class="metric-row"><span>${m[0]}</span><span><strong>${m[1]}</strong></span></div>`;
      });
    }
  });

  div.innerHTML=html;
  el.appendChild(div);
  window.scrollTo({top:0,behavior:'smooth'});
}

function selectOption(btn,stepIdx){
  btn.classList.add('selected');
  const val=btn.dataset.value;
  answers['step_'+stepIdx]=val;
  setTimeout(()=>goNext(stepIdx),300);
}

function toggleMulti(btn){
  btn.classList.toggle('selected');
}

function goNext(idx){
  // Handle step 11 special case (disqualification has 2 buttons)

function submitLead(idx){
  const n=document.getElementById('field_nombre');
  const e=document.getElementById('field_email');
  if(n)userName=n.value.trim()||'';
  if(!userName){alert('Por favor ingresá tu nombre');return;}
  if(e&&!e.value.trim()){alert('Por favor ingresá tu email');return;}
  answers.nombre=userName;
  answers.email=e?e.value.trim():'';
  const w=document.getElementById('field_whatsapp');
  if(w)answers.whatsapp=w.value.trim();
  goNext(idx);
}

function renderLoading(s){
  const labels=s.labels||['Cargando...'];
  return `<div class="loading-wrap">
    <div class="loading-spinner"></div>
    <div class="loading-pct" id="loadPct">0%</div>
    <div class="loading-label" id="loadLabel">${labels[0]}</div>
  </div>`;
}

function animateLoading(idx){
  const s=steps[idx];
  const labels=s.labels||['Cargando...'];
  let pct=0;
  const pctEl=document.getElementById('loadPct');
  const lblEl=document.getElementById('loadLabel');
  const interval=setInterval(()=>{
    pct+=Math.random()*4+1;
    if(pct>100)pct=100;
    pctEl.textContent=Math.round(pct)+'%';
    const li=Math.min(Math.floor((pct/100)*labels.length),labels.length-1);
    lblEl.textContent=labels[li];
    if(pct>=100){
      clearInterval(interval);
      setTimeout(()=>goNext(idx),600);
    }
  },80);
}
