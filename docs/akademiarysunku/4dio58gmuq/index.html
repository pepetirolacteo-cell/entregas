<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Twój dostęp — Akademia Rysunku</title>
<style>
  html, body { margin:0; background:#0c0c1a; color:#ffffff; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  .wrap { max-width:560px; margin:0 auto; padding:64px 20px; text-align:center; }
  .badge { display:inline-block; font-size:12px; letter-spacing:.08em; text-transform:uppercase; background:#1faee933; color:#f4b627; padding:6px 12px; border-radius:99px; }
  h1 { font-size:28px; line-height:1.2; margin:18px 0 10px; color:#ffffff; }
  p { font-size:17px; line-height:1.55; color:#9ca3af; }
  .card { background:#131320; border:1px solid #2a2a3a; border-radius:16px; padding:24px 20px; margin-top:28px; }
  .card strong { color:#f4b627; }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%; background:#f4b627; margin-right:8px; animation:p 1.6s infinite; }
  @keyframes p { 50% { opacity:.3; } }
  @media (prefers-reduced-motion: reduce) { .dot { animation:none; } }
</style>
</head>
<body>
  <div class="wrap">
    <span class="badge">Zakup potwierdzony</span>
    <h1>Akademia Rysunku — Kompletny Kurs Rysunku od Podstaw</h1>
    <p>Dziękujemy! Kończymy przygotowywać Twój materiał. Ta sama strona zaktualizuje się o wszystkie Twoje pliki.</p>
    <div class="card">
      <p><span class="dot"></span><strong>Zapisz ten link</strong></p>
      <p>To Twój dożywotni dostęp. Wróć za kilka godzin, a znajdziesz tu pełny kurs, gotowy do rozpoczęcia.</p>
    </div>
  </div>
</body>
</html>
