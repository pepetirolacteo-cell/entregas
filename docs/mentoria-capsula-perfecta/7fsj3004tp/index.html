<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,interactive-widget=resizes-content">
<meta name="robots" content="noindex,nofollow">
<title>Mentoría Cápsula Perfecta · Mundo de las Cápsulas</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Georgia:wght@400;500;600;700;800&family=system-ui:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff3f1;--paper:#ffffff;--ink:#3d2419;--ink-soft:#8a6d2c;--
accent:#d4a843;--accent-dark:#2a1712;--line:#f3ddd0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink)}
body{font-family:'system-ui',-apple-system,Arial,sans-serif;line-
height:1.5;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
header{background:var(--accent-dark);color:var(--paper);padding:14px 16px;display:flex;align-
items:center;gap:12px}
.av{width:40px;height:40px;border-radius:50%;background:var(--paper);color:var(--accent-
dark);display:flex;align-items:center;justify-content:center;font-weight:800;font-
family:'Georgia',Georgia,serif;font-size:18px;flex:none}
header b{display:block;font-family:'Georgia',Georgia,serif;font-size:17px}
header small{opacity:.85}
#log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;max-
width:760px;width:100%;margin:0 auto}
.m{max-width:88%;padding:11px 14px;border-radius:16px;white-space:pre-wrap;word-wrap:break-
word;font-size:16px}
.bot{background:var(--paper);border:1px solid var(--line);align-self:flex-start;border-
bottom-left-radius:4px}
.yo{background:var(--accent);color:var(--paper);align-self:flex-end;border-bottom-right-
radius:4px}
.err{background:#fbeaea;border:1px solid #e3b4b4;align-self:flex-start}
.err button{margin-top:8px;border:0;background:var(--accent-dark);color:var(--paper);border-
radius:8px;padding:6px 12px;font:inherit;font-weight:700;cursor:pointer}
.typing span{display:inline-block;width:7px;height:7px;margin:0 2px;border-
radius:50%;background:var(--ink-soft);animation:b 1s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.3;transform:translateY(0)}40%
{opacity:1;transform:translateY(-3px)}}
@media (prefers-reduced-motion:reduce){.typing span{animation:none}}
#chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 16px 10px;max-
width:760px;width:100%;margin:0 auto}
#chips button{border:1px solid var(--accent);background:var(--paper);color:var(--accent-
dark);border-radius:99px;padding:8px 14px;font:inherit;font-size:14px;font-
weight:700;cursor:pointer;text-align:left}
form{display:flex;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-
bottom));background:var(--paper);border-top:1px solid var(--line)}
form .in{display:flex;gap:8px;max-width:760px;width:100%;margin:0 auto}
textarea{flex:1;min-width:0;resize:none;border:2px solid var(--line);border-
radius:14px;padding:11px 13px;font:inherit;font-size:16px;max-height:140px;background:var(--
bg);color:var(--ink);outline:none}
textarea:focus{border-color:var(--accent)}
form button{border:0;border-radius:14px;background:var(--accent);color:var(--
paper);font:inherit;font-weight:800;padding:0 18px;min-height:48px;cursor:pointer}
form button:disabled{opacity:.5}
</style>
</head>
<body>
<header><div class="av" id="av">IA</div><div><b id="nom"></b><small id="rol"></small></div>
</header>
<div id="log" role="log" aria-live="polite"></div>

<div id="chips"></div>
<form id="f"><div class="in"><textarea id="q" rows="1" placeholder=""></textarea><button 
id="send" type="submit"></button></div></form>
<script>
/* =====================================================================
   CONFIG DEL CHAT. Regla dura: acá NUNCA va una API key (ni entera, ni
   partida, ni ofuscada). El chat le habla a TU proxy, que tiene la key
   guardada como secreto del lado del servidor.
   ===================================================================== */
const CHAT = {
  proxyUrl: "https://eqptprfkflexjkjedgvd.supabase.co/functions/v1/ai-proxy",            // ej: https://<tu-proyecto>.supabase.co/functions/v1/ai-proxy
  modelo: "gemini-flash-lite-latest",                 // el más barato que esté en la allowlist del proxy
  nombre: "Mentora Cápsula Perfecta",
  rol: "Asistente de Mundo de las Cápsulas",
  bienvenida: "¡Hola! Soy tu asistente. Preguntame lo que necesites sobre el producto y te respondo al toque.",
  placeholder: "Escribí tu pregunta…",
  enviar: "Enviar",
  errorTxt: "No pude responder ahora. Probá de nuevo en unos segundos.",
  reintentar: "Reintentar",
  sugerencias: [
    "La cápsula no se disuelve bien en el agua caliente, ¿qué hago?",
    "¿Cuánta miel uso como aglutinante?",
    "¿A qué temperatura seco las cápsulas en el horno?",
    "¿Cómo calculo el precio de venta?"
  ],
  maxHistorial: 12,
  // CONOCIMIENTO: resumen del core y de cada bono. Si el core tiene ítems
  // numerados, pegá el CATÁLOGO COMPLETO numerado (generado desde contenido.py),
  // nunca ejemplos sueltos: si no, el modelo inventa números.
  sistema: `Sos Mentora Cápsula Perfecta, asistente experto de "Mundo de las Cápsulas".
Tu trabajo: ayudar a quien compró el producto a sacarle provecho.
Reglas:
- Respondé solo sobre el tema del producto. Si preguntan otra cosa, redirigí con amabilidad.
- Respuestas cortas y prácticas, con pasos numerados cuando aplique.
- Cuando recomiendes un ítem del catálogo, usá SIEMPRE su número exacto de la lista. Si no
estás seguro del número, nombralo sin número. Nunca inventes números, ítems ni páginas.
- Nunca des consejos médicos, legales ni financieros personalizados.
- Nunca des datos de contacto ni derives a canales externos.
- Idioma: rioplatense con voseo.
CATÁLOGO Y CONTENIDO DEL PRODUCTO:
GUÍA DE REFERENCIA: "Cápsulas Lucrativas" (Fernanda Caroline) — técnica y negocio de cápsulas de infusión gourmet hechas en casa.

QUÉ ES: cápsula de infusión gourmet (té, café, hierbas, especias). Es una tableta prensada y seca hecha con ingredientes molidos + miel como aglutinante, prensada en un molde y secada en horno a baja temperatura. Al ponerla en agua bien caliente, se disuelve completamente y libera la infusión, como un saquito de té pero en formato sólido. La cápsula es mate, seca y firme al tacto. NO es un bombón, NO tiene chocolate, NO se come: se usa exclusivamente para preparar infusiones.

TÉCNICA BASE (6 pasos):
1. Moler los ingredientes secos (té, café, hierbas, especias) a molienda media-fina. Que quede uniforme, sin pedazos grandes ni polvo excesivo.
2. Mezclar los ingredientes molidos con miel pura como aglutinante (proporción: 15-25% del peso total de la mezcla seca). Amasar hasta lograr una masa cohesiva que se sostenga al apretarla.
3. Prensar la mezcla en moldes de silicona o metal, presionando firme y parejo para que la cápsula quede compacta y sin huecos de aire.
4. Secar en horno a temperatura baja (50-70°C) entre 45 minutos y 2 horas. La puerta puede quedar entreabierta para que circule el aire.
5. Verificar que estén listas: firmes al tacto, superficie mate y seca, no ceden al presionarlas. Partir una por la mitad para confirmar que el interior esté seco y uniforme.
6. Enfriar completamente sobre rejilla (mínimo 1 hora) antes de envasar. Nunca guardar las cápsulas calientes en envase cerrado.

ERRORES COMUNES Y SOLUCIÓN:
- La cápsula se desarma al sacarla del molde → demasiado poca miel o prensado flojo. Solución: agregar un poquito más de miel y prensar con más firmeza.
- La cápsula no se disuelve en agua caliente → molienda muy gruesa o prensado excesivo. Solución: moler más fino y/o prensar con menos fuerza. Probar disolución con cada lote nuevo (debe deshacerse en 2-4 minutos a 85°C).
- Cápsulas que se ablandan con el tiempo → secado insuficiente o exceso de miel. Solución: secar más tiempo y/o reducir la proporción de miel.
- Aparece moho después de unos días → humedad residual interna. Solución: asegurar secado completo (partir una cápsula del lote y verificar interior seco), envasar solo cuando estén frías y secas.
- Pérdida de aroma con el tiempo → envase no hermético o exposición a luz/calor. Solución: envasar en recipientes herméticos opacos inmediatamente después del enfriado.

5 FAMILIAS DE RECETAS (21 recetas + 4 formas):
Familia TÉ (5): Té Negro Clásico, Té Verde con Jazmín, Earl Grey con Bergamota, Chai Especiado, Té Blanco con Miel.
Familia CAFÉ (4): Café Intenso, Café con Canela, Moka (café+cacao), Capuchino (café+leche en polvo+canela).
Familia INFUSIÓN (4): Manzanilla Dorada, Menta Fresca, Tilo Relajante, Jengibre con Limón.
Familia FRUTAL (4): Frutos Rojos, Tropical (mango+maracuyá deshidratados), Manzana con Canela, Cítricos (naranja+limón deshidratados).
Familia ARGENTINA (4): Yerba Mate, Cedrón, Dulce de Leche Cremoso (con leche en polvo+esencia), Burrito y Peperina.

FORMAS: Esfera/disco (fácil, molde estándar), Corazón (medio, cuidar las puntas), Estrella (medio), Flor (avanzado, pétalos finos se quiebran fácil).

CONSERVACIÓN: guardar en envase hermético opaco, lugar seco y fresco (18-24°C), lejos de la luz directa y olores fuertes. NO necesitan heladera. Cada variedad en su propio envase para evitar contaminación de aromas. Sachéts de gel de sílice apto alimentos para cápsulas frutales. Vida útil por tipo: café y té negro 4-6 meses, té verde 2-4 meses, hierbas 3-5 meses, especias 4-6 meses, frutales 6-10 semanas, yerba mate 3-5 meses.

PACKAGING: formato de empaque siempre igual (identidad de marca). Etiqueta con datos mínimos: variedad, ingredientes, fecha de elaboración, fecha de consumo preferente, y modo de uso ("Colocá la cápsula en una taza con agua bien caliente (85°C), esperá 2-4 minutos a que se disuelva por completo y disfrutá tu infusión"). Envases recomendados: bolsas kraft con interior de aluminio y cierre zip, latas con tapa a presión, frascos de vidrio oscuro con tapa a rosca. Sets de regalo (3-6 sabores) se venden mejor que unidades sueltas.

PRECIOS (fórmula): costo de ingredientes por unidad + costo de packaging por unidad + tiempo de trabajo valorizado por hora + margen de ganancia (30% a 50%) = precio de venta.

REDES SOCIALES: el contenido que más se comparte es el momento en que la cápsula se disuelve en la taza (reel, a cámara lenta si se puede). Otras ideas: detrás de escena preparando mezclas, mostrando ingredientes, probando sabor nuevo pidiendo opinión, post explicando el trabajo detrás del precio, armado de caja de regalo, testimonio real de clienta.

PRIMERAS CLIENTAS: empezar por el círculo cercano (regalar o vender a costo a familia/amigas, pedir foto/video, primer testimonio). Boca en boca (redes en el packaging). Ferias/mercados artesanales de la zona. Lista clara de sabores y responder rápido.

ESCALAR: calendario fijo de producción. Si hay más pedidos de los que se pueden cubrir, subir el precio (no trabajar más horas). Catálogo fijo de 6-8 sabores bien dominados. Preparar mezclas secas por adelantado, prensar y secar más cerca de la entrega. Registro simple de ingresos y gastos mensual.

PREGUNTAS FRECUENTES:
- ¿Puedo usar hierbas frescas? No, solo hierbas secas. Las frescas aportan humedad y la cápsula no va a secar bien. Secá las hierbas primero o compralas ya deshidratadas.
- ¿Sin moldes? Se puede usar una cucharita medidora y prensar a mano, pero el resultado es menos prolijo. Los moldes de silicona dan mejor forma y consistencia.
- ¿Cuánto rinde 500g de mezcla seca? Entre 40 y 80 cápsulas, según el tamaño del molde.
- ¿Puedo mezclar familias? Sí, la gracia es experimentar. Pero anotá siempre las proporciones para poder replicar los que funcionan.
- ¿Necesito algún equipo especial? No. Mortero o procesadora, bowl, moldes de silicona, horno convencional y envases herméticos.
- ¿Registro sanitario para vender? Depende del país/provincia/municipio y de si se vende ocasional o regular. Esto NO es asesoramiento legal/impositivo/contable: siempre derivar a un contador o al municipio de la alumna.

AVISOS QUE LA MENTORA SIEMPRE RESPETA:
- Alergias: las cápsulas pueden contener miel (no apta para menores de 1 año), frutos secos o trazas según la receta. Recordar aclarar siempre los ingredientes y trabajar con manos/superficies limpias.
- Los consejos de precio, venta y crecimiento son orientación general basada en experiencia práctica, no asesoramiento legal, impositivo ni contable.`
};
/* ===================================================================== */
const log = document.getElementById("log"), q = document.getElementById("q"), send = 
document.getElementById("send"), chips = document.getElementById("chips");
document.getElementById("nom").textContent = CHAT.nombre;
document.getElementById("rol").textContent = CHAT.rol;
document.getElementById("av").textContent = (CHAT.nombre || "IA").trim().slice(0, 
1).toUpperCase();
q.placeholder = CHAT.placeholder; send.textContent = CHAT.enviar;
let historial = [];
try { historial = JSON.parse(sessionStorage.getItem("chat-" + location.pathname) || "[]"); } 
catch (e) {}
function persistir() { try { sessionStorage.setItem("chat-" + location.pathname, 
JSON.stringify(historial.slice(-CHAT.maxHistorial))); } catch (e) {} }
function burbuja(txt, cls) { const d = document.createElement("div"); d.className = "m " + 
cls; d.textContent = txt; log.append(d); log.scrollTop = log.scrollHeight; return d; }
function limpiar(t) { return t.replace(/\*\*(.+?)\*\*/g, "$1").replace(/^#+\s*/gm, 
"").replace(/^\s*[-*]\s+/gm, "• "); }
burbuja(CHAT.bienvenida, "bot");

historial.forEach(h => burbuja(h.parts[0].text, h.role === "user" ? "yo" : "bot"));
if (!historial.length) CHAT.sugerencias.forEach(s => { const b = 
document.createElement("button"); b.type = "button"; b.textContent = s; b.onclick = () => 
preguntar(s); chips.append(b); });
async function preguntar(texto) {
  texto = (texto || "").trim(); if (!texto) return;
  chips.innerHTML = "";
  burbuja(texto, "yo");
  historial.push({ role: "user", parts: [{ text: texto }] });
  await responder();
}
async function responder() {
  send.disabled = true;
  const t = document.createElement("div"); t.className = "m bot typing"; 
t.setAttribute("aria-label", "…"); t.innerHTML = "<span></span><span></span><span></span>"; 
log.append(t); log.scrollTop = log.scrollHeight;
  try {
    const r = await fetch(CHAT.proxyUrl, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: CHAT.modelo,
        systemInstruction: { parts: [{ text: CHAT.sistema }] },
        contents: historial.slice(-CHAT.maxHistorial),
        generationConfig: { temperature: 0.7, maxOutputTokens: 800 }
      })
    });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const d = await r.json();
    const txt = (d.candidates?.[0]?.content?.parts || []).map(p => p.text || 
"").join("").trim();
    if (!txt) throw new Error("vacío");
    t.remove();
    burbuja(limpiar(txt), "bot");
    historial.push({ role: "model", parts: [{ text: txt }] });
    persistir();
  } catch (e) {
    t.remove();
    const d = burbuja(CHAT.errorTxt, "err");
    const b = document.createElement("button"); b.type = "button"; b.textContent = 
CHAT.reintentar;
    b.onclick = () => { d.remove(); responder(); };
    d.append(document.createElement("br"), b);
  } finally { send.disabled = false; q.focus(); }
}
document.getElementById("f").addEventListener("submit", e => { e.preventDefault(); const v = 
q.value; q.value = ""; q.style.height = "auto"; preguntar(v); });
q.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { 
e.preventDefault(); document.getElementById("f").requestSubmit(); } });
q.addEventListener("input", () => { q.style.height = "auto"; q.style.height = 
Math.min(q.scrollHeight, 140) + "px"; });
</script>
</body>
</html>
