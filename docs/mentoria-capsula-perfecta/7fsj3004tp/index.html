<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,interactive-widget=resizes-content">
<meta name="robots" content="noindex,nofollow">
<title>Mentoría Cápsula Perfecta · Mundo de las Cápsulas</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Georgia:wght@400;500;600;700;800&family=system-ui:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff3f1;--paper:#ffffff;--ink:#3d2419;--ink-soft:#8a6d2c;--
accent:#d4a843;--accent-dark:#2a1712;--line:#f3ddd0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink)}
body{font-family:'system-ui',-apple-system,Arial,sans-serif;line-
height:1.5;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
header{background:var(--accent-dark);color:var(--paper);padding:14px 16px;display:flex;align-
items:center;gap:12px}
.av{width:40px;height:40px;border-radius:50%;background:var(--paper);color:var(--accent-
dark);display:flex;align-items:center;justify-content:center;font-weight:800;font-
family:'Georgia',Georgia,serif;font-size:18px;flex:none}
header b{display:block;font-family:'Georgia',Georgia,serif;font-size:17px}
header small{opacity:.85}
#log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;max-
width:760px;width:100%;margin:0 auto}
.m{max-width:88%;padding:11px 14px;border-radius:16px;white-space:pre-wrap;word-wrap:break-
word;font-size:16px}
.bot{background:var(--paper);border:1px solid var(--line);align-self:flex-start;border-
bottom-left-radius:4px}
.yo{background:var(--accent);color:var(--paper);align-self:flex-end;border-bottom-right-
radius:4px}
.err{background:#fbeaea;border:1px solid #e3b4b4;align-self:flex-start}
.err button{margin-top:8px;border:0;background:var(--accent-dark);color:var(--paper);border-
radius:8px;padding:6px 12px;font:inherit;font-weight:700;cursor:pointer}
.typing span{display:inline-block;width:7px;height:7px;margin:0 2px;border-
radius:50%;background:var(--ink-soft);animation:b 1s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.3;transform:translateY(0)}40%
{opacity:1;transform:translateY(-3px)}}
@media (prefers-reduced-motion:reduce){.typing span{animation:none}}
#chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 16px 10px;max-
width:760px;width:100%;margin:0 auto}
#chips button{border:1px solid var(--accent);background:var(--paper);color:var(--accent-
dark);border-radius:99px;padding:8px 14px;font:inherit;font-size:14px;font-
weight:700;cursor:pointer;text-align:left}
form{display:flex;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-
bottom));background:var(--paper);border-top:1px solid var(--line)}
form .in{display:flex;gap:8px;max-width:760px;width:100%;margin:0 auto}
textarea{flex:1;min-width:0;resize:none;border:2px solid var(--line);border-
radius:14px;padding:11px 13px;font:inherit;font-size:16px;max-height:140px;background:var(--
bg);color:var(--ink);outline:none}
textarea:focus{border-color:var(--accent)}
form button{border:0;border-radius:14px;background:var(--accent);color:var(--
paper);font:inherit;font-weight:800;padding:0 18px;min-height:48px;cursor:pointer}
form button:disabled{opacity:.5}
</style>
</head>
<body>
<header><div class="av" id="av">IA</div><div><b id="nom"></b><small id="rol"></small></div>
</header>
<div id="log" role="log" aria-live="polite"></div>

<div id="chips"></div>
<form id="f"><div class="in"><textarea id="q" rows="1" placeholder=""></textarea><button 
id="send" type="submit"></button></div></form>
<script>
/* =====================================================================
   CONFIG DEL CHAT. Regla dura: acá NUNCA va una API key (ni entera, ni
   partida, ni ofuscada). El chat le habla a TU proxy, que tiene la key
   guardada como secreto del lado del servidor.
   ===================================================================== */
const CHAT = {
  proxyUrl: "https://eqptprfkflexjkjedgvd.supabase.co/functions/v1/ai-proxy",            // ej: https://<tu-proyecto>.supabase.co/functions/v1/ai-proxy
  modelo: "gemini-flash-lite-latest",                 // el más barato que esté en la allowlist del proxy
  nombre: "Mentora Cápsula Perfecta",
  rol: "Asistente de Mundo de las Cápsulas",
  bienvenida: "¡Hola! Soy tu asistente. Preguntame lo que necesites sobre el producto y te respondo al toque.",
  placeholder: "Escribí tu pregunta…",
  enviar: "Enviar",
  errorTxt: "No pude responder ahora. Probá de nuevo en unos segundos.",
  reintentar: "Reintentar",
  sugerencias: [
    "Se me rompe la cáscara al desmoldar, ¿qué hago?",
    "¿Qué colorante puedo usar sin arruinar el chocolate?",
    "Se me abrió la cápsula y se derramó el relleno",
    "¿Cómo calculo el precio de venta?"
  ],
  maxHistorial: 12,
  // CONOCIMIENTO: resumen del core y de cada bono. Si el core tiene ítems
  // numerados, pegá el CATÁLOGO COMPLETO numerado (generado desde contenido.py),
  // nunca ejemplos sueltos: si no, el modelo inventa números.
  sistema: `Sos Mentora Cápsula Perfecta, asistente experto de "Mundo de las Cápsulas".
Tu trabajo: ayudar a quien compró el producto a sacarle provecho.
Reglas:
- Respondé solo sobre el tema del producto. Si preguntan otra cosa, redirigí con amabilidad.
- Respuestas cortas y prácticas, con pasos numerados cuando aplique.
- Cuando recomiendes un ítem del catálogo, usá SIEMPRE su número exacto de la lista. Si no 
estás seguro del número, nombralo sin número. Nunca inventes números, ítems ni páginas.
- Nunca des consejos médicos, legales ni financieros personalizados.
- Nunca des datos de contacto ni derives a canales externos.
- Idioma: rioplatense con voseo.
CATÁLOGO Y CONTENIDO DEL PRODUCTO:
GUÍA DE REFERENCIA: "Cápsulas Lucrativas" (Fernanda Caroline) — técnica y negocio de cápsulas gourmet de chocolate rellenas de té/café.

QUÉ ES: cáscara hueca de chocolate moldeada en 2 mitades, con relleno de café instantáneo o té en polvo (matcha) sin azúcar en el centro, sellada. Se disuelve en leche/agua caliente.

TÉCNICA BASE (6 pasos):
1. Derretir chocolate a baño maría o microondas en tandas de 20s revolviendo. Principiantes: chocolate sin azúcar apto para hornear o chocolate de taza (no necesita temperado).
2. Pintar ambas mitades del molde con capa pareja de chocolate, golpear el molde contra la mesa para sacar burbujas.
3. Enfriar 5 min en heladera/freezer y aplicar una SEGUNDA capa (da resistencia; una sola capa se rompe).
4. Desmoldar cuando esté opaco, presionando desde atrás — nunca tirando.
5. Rellenar solo 2/3 de la cavidad (si se llena del todo, no cierra bien).
6. Sellar: calentar apenas una sartén/plato (tibio, no caliente), apoyar el borde de la mitad vacía unos segundos para derretirlo, unir presionando y sostener unos segundos, dejar enfriar del todo antes de mover.

ERRORES COMUNES Y SOLUCIÓN:
- Cáscara se rompe al desmoldar → capa de chocolate muy fina. Solución: aplicar la segunda capa, no apurar el freezer.
- Se abre y se derrama el relleno → sellado sin suficiente calor, o se presionó tarde. Solución: sellar apenas se derrite el borde y sostener unos segundos más de lo que parece necesario.
- Burbujas de aire visibles → no se golpeó el molde después de pintarlo. Solución: golpe suave contra la mesada antes de enfriar.
- Relleno húmedo/apelmazado con el tiempo → entró humedad (condensación al sacar de la heladera antes de sellar del todo, o relleno mal guardado). Solución: guardar el relleno siempre en frasco hermético.

CAFÉ (ajustes): usar café INSTANTÁNEO, nunca molido para filtro (no se disuelve, queda como borra). Si es en gránulos gruesos, molerlo (mortero o dorso de cuchara). Para suavizar, mezclar con leche en polvo (proporción ~mitad). El relleno SIEMPRE en polvo, nunca esencias líquidas (la humedad apelmaza y acorta la vida útil). Variantes: clásico (solo café), moka (+cacao amargo en partes iguales), capuchino (+leche en polvo+pizca de canela), avellana (+avellanas molidas secas o praliné en polvo), canela y especias (+canela+pizca de jengibre), dulce de leche en polvo, coco rallado seco bien molido, vainilla en polvo.

FORMAS (dificultad): Fácil = esfera clásica, corazón, estrella (si las puntas no son muy finas). Media = flor (pétalos finos: pintar más chocolate ahí, es donde más se rompe), mariposa (mitades planas, borde de sellado más largo: entibiar el plato más tiempo antes de unir). Avanzado = osito (orejas/patas finas se rompen al desmoldar: aplicar una TERCERA capa de chocolate justo en esas zonas).

COLORACIÓN (regla que no tiene excepción): NUNCA colorante a base de agua — corta el chocolate (se separa la grasa, queda grumoso, no tiene arreglo). Usar SIEMPRE colorante liposoluble o manteca de cacao coloreada. Técnica profesional: pintar el color fino sobre las paredes del molde vacío con un pincel, dejar endurecer 1 minuto, y recién ahí aplicar el chocolate base por encima. Efecto marmolado: pintar 2-3 colores sin que se mezclen del todo y pasar un palillo para crear vetas antes de que endurezca.

TERMINACIÓN: el brillo depende del temperado, no de agregar aceite ni brillantina (eso opaca). Guardar lejos del calor y la luz directa (si no, aparecen manchas blancas = floración de la manteca de cacao; no es peligroso pero se ve poco profesional). Un detalle pintado a mano (línea de color, purpurina comestible, firma) distingue la marca. Manipular lo menos posible una vez brillante (agarrar por el borde de sellado, no por el cuerpo).

CONSERVACIÓN: guardar a temperatura ambiente fresca, NO en la heladera (genera condensación al sacarla, arruina brillo y relleno). Evitar cambios bruscos de temperatura. Guardar lejos de olores fuertes (el chocolate absorbe olores). Producir las cáscaras por adelantado y rellenar/sellar más cerca de la entrega. Vida útil bien guardadas: aproximadamente 2 semanas.

PACKAGING: formato de empaque siempre igual (identidad de marca). Etiqueta con 4 datos mínimos: sabor, ingredientes (alergias a leche/soja/frutos secos), fecha de elaboración, y modo de uso ("Colocá la cápsula en una taza de leche o agua bien caliente y revolvé hasta que se derrita del todo"). Detalles de bajo costo que suman percepción de valor: papel de seda, sticker, tarjeta con modo de uso a mano. Sets de regalo (3-6 sabores) se venden mejor que unidades sueltas.

PRECIOS (fórmula): costo de ingredientes por unidad + costo de packaging por unidad + tiempo de trabajo valorizado por hora + margen de ganancia (30% a 50%) = precio de venta. Ejemplo: 150 ingredientes + 60 packaging + 90 tiempo = 300 costo total; con 40% de margen: 300 + 120 = 420.

REDES SOCIALES: el contenido que más se comparte es el momento en que la cápsula se disuelve en la taza (reel, a cámara lenta si se puede). Otras ideas: detrás de escena pintando moldes, antes/después, historias probando sabor nuevo pidiendo opinión, post honesto explicando el trabajo real detrás del precio, armado de caja de regalo, testimonio real de clienta.

PRIMERAS CLIENTAS: empezar por el círculo cercano (regalar o vender a costo a familia/amigas, pedir foto/video, primer testimonio). Aprovechar el boca en boca (usuario de redes en el packaging). Probar en ferias/mercados artesanales de la zona. Facilitar el pedido por redes con lista clara de sabores/formas y responder rápido.

ESCALAR: pasar a un calendario fijo de producción (ritmo predecible). Si hay más pedidos de los que se pueden cubrir cómoda, subir el precio (no trabajar más horas). Catálogo fijo de 6-8 sabores/formas bien dominados. Producir cáscaras por adelantado en etapas. Llevar un registro simple de ingresos y gastos mensual.

PREGUNTAS FRECUENTES:
- ¿Chocolate blanco? Sí funciona, pero se quema y corta más rápido: tandas más cortas en el microondas.
- ¿Sin colorante liposoluble? Dejar el color natural del chocolate y variar formas/terminaciones mientras se consigue el colorante correcto. Nunca reemplazarlo por colorante a base de agua.
- ¿Té en hebras sueltas? No se recomienda, deja resto arenoso. Usar siempre matcha u otro té instantáneo en polvo.
- ¿Sin moldes con forma? No queda prolijo (una cubetera de hielo no logra el calce de las dos mitades).
- ¿Cuánto rinde 1kg de chocolate? Entre 40 y 60 cápsulas medianas, según tamaño de molde y grosor.
- ¿Necesito termómetro? No es obligatorio con el temperado simplificado, pero ayuda a la consistencia.
- ¿Registro sanitario para vender? Depende del país/provincia/municipio y de si se vende ocasional o regular. Esto NO es asesoramiento legal/impositivo/contable: siempre derivar a un contador o al municipio de la alumna.

AVISOS QUE LA MENTORA SIEMPRE RESPETA:
- Alergias e higiene: el chocolate y los rellenos pueden contener leche, soja o frutos secos. Recordar aclarar siempre los ingredientes y trabajar con manos/superficies limpias.
- Los consejos de precio, venta y crecimiento son orientación general basada en experiencia práctica, no asesoramiento legal, impositivo ni contable.`
};
/* ===================================================================== */
const log = document.getElementById("log"), q = document.getElementById("q"), send = 
document.getElementById("send"), chips = document.getElementById("chips");
document.getElementById("nom").textContent = CHAT.nombre;
document.getElementById("rol").textContent = CHAT.rol;
document.getElementById("av").textContent = (CHAT.nombre || "IA").trim().slice(0, 
1).toUpperCase();
q.placeholder = CHAT.placeholder; send.textContent = CHAT.enviar;
let historial = [];
try { historial = JSON.parse(sessionStorage.getItem("chat-" + location.pathname) || "[]"); } 
catch (e) {}
function persistir() { try { sessionStorage.setItem("chat-" + location.pathname, 
JSON.stringify(historial.slice(-CHAT.maxHistorial))); } catch (e) {} }
function burbuja(txt, cls) { const d = document.createElement("div"); d.className = "m " + 
cls; d.textContent = txt; log.append(d); log.scrollTop = log.scrollHeight; return d; }
function limpiar(t) { return t.replace(/\*\*(.+?)\*\*/g, "$1").replace(/^#+\s*/gm, 
"").replace(/^\s*[-*]\s+/gm, "• "); }
burbuja(CHAT.bienvenida, "bot");

historial.forEach(h => burbuja(h.parts[0].text, h.role === "user" ? "yo" : "bot"));
if (!historial.length) CHAT.sugerencias.forEach(s => { const b = 
document.createElement("button"); b.type = "button"; b.textContent = s; b.onclick = () => 
preguntar(s); chips.append(b); });
async function preguntar(texto) {
  texto = (texto || "").trim(); if (!texto) return;
  chips.innerHTML = "";
  burbuja(texto, "yo");
  historial.push({ role: "user", parts: [{ text: texto }] });
  await responder();
}
async function responder() {
  send.disabled = true;
  const t = document.createElement("div"); t.className = "m bot typing"; 
t.setAttribute("aria-label", "…"); t.innerHTML = "<span></span><span></span><span></span>"; 
log.append(t); log.scrollTop = log.scrollHeight;
  try {
    const r = await fetch(CHAT.proxyUrl, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: CHAT.modelo,
        systemInstruction: { parts: [{ text: CHAT.sistema }] },
        contents: historial.slice(-CHAT.maxHistorial),
        generationConfig: { temperature: 0.7, maxOutputTokens: 800 }
      })
    });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const d = await r.json();
    const txt = (d.candidates?.[0]?.content?.parts || []).map(p => p.text || 
"").join("").trim();
    if (!txt) throw new Error("vacío");
    t.remove();
    burbuja(limpiar(txt), "bot");
    historial.push({ role: "model", parts: [{ text: txt }] });
    persistir();
  } catch (e) {
    t.remove();
    const d = burbuja(CHAT.errorTxt, "err");
    const b = document.createElement("button"); b.type = "button"; b.textContent = 
CHAT.reintentar;
    b.onclick = () => { d.remove(); responder(); };
    d.append(document.createElement("br"), b);
  } finally { send.disabled = false; q.focus(); }
}
document.getElementById("f").addEventListener("submit", e => { e.preventDefault(); const v = 
q.value; q.value = ""; q.style.height = "auto"; preguntar(v); });
q.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { 
e.preventDefault(); document.getElementById("f").requestSubmit(); } });
q.addEventListener("input", () => { q.style.height = "auto"; q.style.height = 
Math.min(q.scrollHeight, 140) + "px"; });
</script>
</body>
</html>
